<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Listen to Music, Podcasts, and Audiobooks Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <main>
        <div class="main flex">
            <div class="left">
                <div class="home bg-grey rounded m1 p1">
                    <div class="logo"><img class="invert" src="assets/logo.svg" alt="logo"></div>
                    <ul>
                        <li><img class="invert" src="assets/home.svg" alt="home">Home</li>
                        <li><img class="invert" src="assets/search.svg" alt="search">Search</li>
                    </ul>
                </div>
                <div class="library bg-grey rounded m1 p1">
                    <div class="heading flex">
                        Your library
                        <img src="assets/plus.svg" alt="plus">
                    </div>
                    <div class="songList">
                        <ul>
                            
                        </ul>
                    </div>
                    <div class="footer">
                        <ul class="flex" role="list">
                            <li>
                                <a href="https://www.spotify.com/in-en/legal/" tabindex="0">Legal</a>
                            </li>
                            <li>
                                <a href="https://www.spotify.com/in-en/safetyandprivacy/" tabindex="0">Safety &amp;
                                    Privacy Center</a>
                            </li>
                            <li>
                                <a href="https://www.spotify.com/in-en/legal/privacy-policy/" tabindex="0">Privacy
                                    Policy</a>
                            </li>
                            <li>
                                <a href="https://www.spotify.com/in-en/legal/cookies-policy/" tabindex="0">Cookies</a>
                            </li>
                            <li>
                                <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3" tabindex="0">About
                                    Ads</a>
                            </li>
                            <li>
                                <a href="https://www.spotify.com/in-en/accessibility/" tabindex="0">Accessibility</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="right bg-grey rounded m1">
                <div class="header flex">
                    <div class="nav">


                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                    </div>
                    <div class="buttons">
                        <button class="signup-btn">Sign up</button>
                        <button class="login-btn">Log in</button>
                    </div>
                </div>
                <div class="spotify-playlists">
                    <h1>Spotify Playlists</h1>
                    <div class="card-container flex">
                        <div class="card">
                            <div class="play">
                                <div class="playbtn">
                                    <svg role="img" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"
                                        fill="black">
                                        <path
                                            d="m7.05 3.606 13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606">
                                        </path>
                                    </svg>
                                </div>
                            </div>

                            <img src="https://i.scdn.co/image/ab67616d00001e02292341cd3e621d7f9171331f" alt="song ">
                            <h2>Happy Hits!</h2>
                            <p>Hits to boost your mood and fill you with happiness</p>
                        </div>
                        <div class="card">
                            <div class="play">
                                <div class="playbtn">
                                    <svg role="img" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"
                                        fill="black">
                                        <path
                                            d="m7.05 3.606 13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606">
                                        </path>
                                    </svg>
                                </div>
                            </div>

                            <img src="https://i.scdn.co/image/ab67616d00001e02292341cd3e621d7f9171331f" alt="song ">
                            <h2>Happy Hits!</h2>
                            <p>Hits to boost your mood and fill you with happiness</p>
                        </div>
                    </div>
                </div>
                <div class="player flex justify-center items-center">
                    <div class="seekbar">
                        <div class="circle"></div>
                    </div>
                    <div class="songInfo"></div>
                    <div class="playbuttons flex justify-center items-center">
                    <img class="previous" src="assets/prevsong.svg" alt="previousbtn">
                    <img class="play" src="assets/play.svg" alt="playbtn">
                    <img class="next" src="assets/nextsong.svg" alt="nextbtn">
                    </div>
                  <div class="songTime"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
